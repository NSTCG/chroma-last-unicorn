<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>CHROMA</title><style>*{box-sizing:border-box;margin:0;padding:0;user-select:none}body,html{width:100%;height:100%;overflow:hidden;background:#08080c;font-family:sans-serif;color:#fff}#canvas-container{position:absolute;inset:0}canvas{width:100%;height:100%;display:block}#crosshair{position:absolute;top:50%;left:50%;width:8px;height:8px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.7);pointer-events:none;z-index:10}#crosshair.active{transform:translate(-50%,-50%) scale(2.2);background:#f5a}#top-left-bar{position:absolute;top:12px;left:12px;z-index:99}.nav-vr-btn{background:linear-gradient(135deg,#0ff,#05f);color:#fff;border:none;border-radius:99px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer}#overlay{position:absolute;inset:0;z-index:20;background:rgba(5,5,10,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;transition:opacity .6s}#overlay.hidden{opacity:0;pointer-events:none}.title-glitch{font-size:clamp(2.4rem,6vw,4rem);font-weight:800;letter-spacing:4px;background:linear-gradient(135deg,#fff,#f8d 40%,#0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}.tagline{font-size:.95rem;color:#a0a5be;margin-bottom:20px}.btn-group{display:flex;gap:12px;justify-content:center}.action-btn{padding:10px 24px;border-radius:99px;font-size:.95rem;font-weight:600;cursor:pointer;border:none;text-transform:uppercase}.btn-primary{background:linear-gradient(135deg,#f07,#70f);color:#fff}.btn-vr{background:linear-gradient(135deg,#0ff,#05f);color:#fff}.controls-hint{margin-top:20px;font-size:.8rem;color:#7e839e;display:flex;flex-direction:column;gap:4px;align-items:center}.key-badge{background:rgba(255,255,255,.1);padding:2px 5px;border-radius:4px;color:#fff}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script></head><body><div id="canvas-container"></div><div id="crosshair"></div><div id="top-left-bar"><button id="nav-vr-btn" class="nav-vr-btn">🥽 VR</button></div><div id="overlay"><div class="title-glitch">CHROMA</div><div class="tagline">Awaken the 7 colors & ride Celestial Rainbow.</div><div class="btn-group"><button class="action-btn btn-primary" id="btn-start-pc">✨ Play</button><button class="action-btn btn-vr" id="btn-start-vr">🥽 WebXR</button></div><div class="controls-hint"><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><div><span class="key-badge">WASD</span> Move</div><div><span class="key-badge">MOUSE</span> Look</div><div><span class="key-badge">CLICK/E</span> Ride</div><div><span class="key-badge">SPACE</span> Float</div></div><div style="color:#00f0ff;font-size:.78rem">🥽 VR: Left: Move | Right: Turn | Trigger: Laser</div></div></div><script type="module" src="/src/main.js"></script></body></html>
