<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>CHROMA</title><style>*{box-sizing:border-box;margin:0;padding:0}body,html{width:100%;height:100%;overflow:hidden;background:#08080c;font-family:sans-serif;color:#fff;user-select:none}#canvas-container{position:absolute;inset:0}canvas{width:100%;height:100%;display:block;touch-action:none}#crosshair{position:absolute;top:50%;left:50%;width:8px;height:8px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.7);pointer-events:none;z-index:10}#crosshair.active{transform:translate(-50%,-50%) scale(2.2);background:#f5a}#top-left-bar{position:absolute;top:12px;left:12px;z-index:99}.nav-vr-btn,.action-btn{border:none;border-radius:99px;color:#fff;cursor:pointer;font-weight:700}.nav-vr-btn{background:linear-gradient(135deg,#0ff,#05f);padding:5px 12px;font-size:11px}#overlay{position:absolute;inset:0;z-index:20;background:rgba(5,5,10,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;transition:opacity .6s}#overlay.hidden{opacity:0;pointer-events:none}.title-glitch{font-size:clamp(2.4rem,6vw,4rem);font-weight:800;letter-spacing:4px;color:#0ff;text-shadow:0 0 24px #f07;margin-bottom:6px}.tagline{font-size:.95rem;color:#a0a5be;margin-bottom:20px}.btn-group{display:flex;gap:12px}.action-btn{padding:10px 24px;font-size:.95rem;text-transform:uppercase}.btn-primary{background:linear-gradient(135deg,#f07,#70f)}.btn-vr{background:linear-gradient(135deg,#0ff,#05f)}.controls-hint{margin-top:20px;font-size:.8rem;color:#7e839e;display:flex;flex-direction:column;gap:6px}.key-badge{background:rgba(255,255,255,.12);padding:2px 6px;border-radius:4px;color:#fff}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script></head><body><div id="canvas-container"></div><div id="crosshair"></div><div id="top-left-bar"><button id="nav-vr-btn" class="nav-vr-btn">🥽 VR</button></div><div id="overlay"><div class="title-glitch">CHROMA</div><div class="tagline">Awaken the 7 colors.</div><div class="btn-group"><button class="action-btn btn-primary" id="btn-start-pc">✨ Play</button><button class="action-btn btn-vr" id="btn-start-vr">🥽 WebXR</button></div><div class="controls-hint"><div><span class="key-badge">LEFT</span> Drag Look &nbsp; <span class="key-badge">RIGHT</span> Move Joy &nbsp; <span class="key-badge">WASD</span> Keys &nbsp; <span class="key-badge">TAP/E</span> Ride</div><div style="color:#0ff">🥽 VR: Left Move | Right Turn | Trigger Laser</div></div></div><script type="module" src="/src/main.js"></script></body></html>
